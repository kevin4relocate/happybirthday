<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#0b090e">
 <meta name="description" content="Internal birthday video loop generator.">
 <title>Birthday Studio</title>
 <link rel="icon" href="./favicon.svg" type="image/svg+xml">
 <link rel="stylesheet" href="./styles.css">
</head>
<body>
 <div class="app">
  <header class="top">
   <a class="brand" href="./" aria-label="Birthday Studio home">
    <span class="monogram">✦</span>
    <span><b>Birthday Studio</b></span>
   </a>
  </header>
  <main class="workspace">
   <section class="studio" aria-label="Create birthday video">
    <form id="creator-form" class="creator">
     <label for="song-title">SONG TITLE</label>
     <input id="song-title" type="text" maxlength="90" autocomplete="off" required value="Happy Birthday, Make a Wish" placeholder="Happy Birthday, Make a Wish">
     <label for="artist-name">ARTIST NAME</label>
     <input id="artist-name" type="text" maxlength="50" autocomplete="off" required value="Lucio Bruno" placeholder="Lucio Bruno">
     <button id="generate" class="primary" type="submit"><span aria-hidden="true">✦</span> Generate <span aria-hidden="true">→</span></button>
    </form>
    <button class="download" id="download" type="button" disabled>
     <span class="download-icon" aria-hidden="true">↓</span>
     <span class="download-label"><b>Download seamless loop</b><small>10 seconds · 1920 × 1080 · WebM</small></span>
     <span aria-hidden="true">↗</span>
    </button>
    <button class="cancel" id="cancel-export" type="button" hidden>Cancel export</button>
    <div class="progress" id="export-progress" hidden><div id="progress-bar"></div></div>
    <p class="status" id="status" role="status" aria-live="polite">Preparing your birthday scene…</p>
   </section>
   <section class="screen" aria-label="Preview">
    <div class="screen-head">
     <div><p class="screen-eyebrow">PREVIEW</p><h2 id="stage-name">Happy Birthday, Make a Wish</h2></div>
     <span class="live"><i></i> LIVE LOOP</span>
    </div>
    <div class="canvas-wrap" id="viewport">
     <canvas id="stage" width="960" height="540" aria-label="Cinematic birthday scene"></canvas>
     <div class="placeholder" id="placeholder">LOADING THE GALA…</div>
     <div class="film-corner corner-left"></div><div class="film-corner corner-right"></div>
    </div>
    <div class="screen-foot">
      <div class="spec"><span class="loop-mark">↺</span><span>10S LOOP</span><span class="dot">•</span><span>300 FRAMES / 30 FPS</span></div>
      <span id="scene-caption" class="scene-label">MIDNIGHT GALA</span>
    </div>
   </section>
  </main>
 </div>
 <script type="module" src="./src/app.js"></script>
</body>
</html>
