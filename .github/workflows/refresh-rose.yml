name: Refresh Rose Garden photograph
on:
  push:
    branches: [v4-cinematic-scenes-20261003]
    paths:
      - scripts/refresh-rose.mjs
      - .github/workflows/refresh-rose.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-rose.mjs
      - name: Commit licensed replacement onto current PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rose-garden.jpg assets/SCENE_CREDITS.json
          if ! git diff --cached --quiet; then
            git commit -m "asset: use timeless rose-and-ribbon birthday cake"
            git fetch origin v4-cinematic-scenes-20261003
            git rebase origin/v4-cinematic-scenes-20261003
            git push origin HEAD:v4-cinematic-scenes-20261003
          fi
