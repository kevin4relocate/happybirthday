name: Import licensed flagship photograph
on:
  push:
    branches: [midnight-gala-clean-rebuild-20261003]
    paths:
      - scripts/import-art.mjs
      - .github/workflows/import-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate editorial birthday artwork
        run: node scripts/import-art.mjs
      - name: Preserve source and license in Git history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/midnight-gala.jpg assets/ART_CREDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "asset: add licensed photography for Midnight Gala"
            git push origin HEAD:midnight-gala-clean-rebuild-20261003
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensed-midnight-gala-photo
          path: |
            assets/midnight-gala.jpg
            assets/ART_CREDIT.json
          if-no-files-found: ignore
