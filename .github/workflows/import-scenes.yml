name: Import verified scene photographs
on:
  push:
    branches: [v4-cinematic-scenes-20261003]
    paths:
      - scripts/import-scene-photos.mjs
      - .github/workflows/import-scenes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/import-scene-photos.mjs
      - name: Record images and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rose-garden.jpg assets/golden-ballroom-cake.jpg assets/golden-ballroom-hall.jpg assets/SCENE_CREDITS.json
          if ! git diff --cached --quiet; then
            git commit -m "asset: add licensed Rose Garden and Golden Ballroom photo library"
            git fetch origin v4-cinematic-scenes-20261003
            git rebase origin/v4-cinematic-scenes-20261003
            git push origin HEAD:v4-cinematic-scenes-20261003
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-photo-ingest
          path: |
            assets/*.jpg
            assets/SCENE_CREDITS.json
          if-no-files-found: ignore
